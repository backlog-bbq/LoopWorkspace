name: 2. Add Identifiers
run-name: Add Identifiers (${{ github.ref_name }})
on:
  workflow_dispatch:

env:
  FASTLANE_SKIP_UPDATE_CHECK: true

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit
  
  identifiers:
    name: Add Identifiers
    needs: validate
    runs-on: ${{ vars.MAC_RUNNER || 'xcode-27' }}
    steps:
      # Checks-out the repo
      - name: Checkout Repo
        uses: actions/checkout@v5
      
      # Patch Fastlane Match to not print tables
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "table_printer.rb not found"
            exit 1
          fi

      # Install project dependencies
      - name: Install Project Dependencies
        run: bundle install

      # Sync the GitHub runner clock with the Windows time server (workaround as suggested in https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        if: runner.environment == 'github-hosted'
        run: sudo sntp -sS time.windows.com
      
      # Create or update identifiers for app
      - name: Fastlane Provision
        run: bundle exec fastlane identifiers
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

      # Self-hosted only: fastlane setup_ci makes a temporary keychain holding your
      # distribution certificate and sets it as the default. Remove it after the job.
      - name: Remove temporary keychain (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        run: |
          security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
          if [ -f "$HOME/Library/Keychains/login.keychain-db" ]; then
            security default-keychain -s "$HOME/Library/Keychains/login.keychain-db" || true
          fi
